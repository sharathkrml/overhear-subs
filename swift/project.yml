name: OverhearSubs
options:
  bundleIdPrefix: com.sharath
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "NO"

packages:
  DesertAntCore:
    url: https://github.com/Desert-Ant-Labs/desert-ant-core.git
    from: 3.1.0
  DesertAntSwift:
    url: https://github.com/Desert-Ant-Labs/desert-ant-swift.git
    from: 2.1.2
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.1.0
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser.git
    from: 1.5.0

targets:
  OverhearSubs:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
    dependencies:
      - package: DesertAntCore
        product: Transcript
      - package: DesertAntSwift
        product: DesertAntUI
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OverhearSubs
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.audio
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.sharath.overhear-subs
        PRODUCT_NAME: OverhearSubs
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        COMBINE_HIDPI_IMAGES: "YES"

  OverhearSubsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: OverhearSubs
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"