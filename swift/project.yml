name: OverhearSubs
options:
  bundleIdPrefix: com.sharath
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "NO"

targets:
  OverhearSubs:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
    dependencies: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OverhearSubs
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.audio
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.sharath.overhear-subs
        PRODUCT_NAME: OverhearSubs
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        COMBINE_HIDPI_IMAGES: "YES"

  OverhearSubsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: OverhearSubs
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"